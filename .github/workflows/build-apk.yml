name: Build PickStatus APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract PickStatus project
        run: |
          rm -rf source
          mkdir source
          unzip -q PickStatus_Flutter.zip -d source

      - name: Prepare Flutter Android wrapper
        working-directory: source/PickStatus
        run: |
          flutter create --platforms=android .

      - name: Install dependencies
        working-directory: source/PickStatus
        run: flutter pub get

      - name: Run tests
        working-directory: source/PickStatus
        run: flutter test

      - name: Build release APK
        working-directory: source/PickStatus
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PickStatus-APK
          path: source/PickStatus/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
