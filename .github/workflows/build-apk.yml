name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Consulter le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Vérifier l'archive PickStatus
        run: |
          set -euo pipefail
          test -f PickStatus_BUILD_READY_V2.zip
          unzip -t PickStatus_BUILD_READY_V2.zip

      - name: Extraire le projet
        run: |
          set -euo pipefail
          rm -rf source
          mkdir source
          unzip -q PickStatus_BUILD_READY_V2.zip -d source
          PROJECT_DIR="$(find source -name pubspec.yaml -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Générer le wrapper Android manquant
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android .

      - name: Nettoyer le test Flutter généré automatiquement
        run: |
          set -euo pipefail
          rm -f "$PROJECT_DIR/test/widget_test.dart"

      - name: Obtenir les dépendances
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyser le code Dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Exécuter les tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Construire l'APK release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Vérifier l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PickStatus-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
